<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Técnico IF</title>
    <style>
        :root {
            --primary: #15803d; /* Verde estilo IF */
            --primary-hover: #166534;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .quiz-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .category {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .question {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background-color: #e2e8f0;
        }

        .option-btn.correct {
            background-color: #dcfce7;
            border-color: #22c55e;
            color: #14532d;
        }

        .option-btn.incorrect {
            background-color: #fee2e2;
            border-color: #ef4444;
            color: #7f1d1d;
        }

        .footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #64748b;
        }

        .next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            display: none;
        }

        .next-btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="quiz-card">
        <div class="category" id="quiz-category">Matéria Técnica</div>
        <div class="question" id="quiz-question">Carregando pergunta...</div>
        <div class="options-grid" id="options-container"></div>
        <div class="footer">
            <span id="quiz-progress">Pergunta 1 de 3</span>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Próxima</button>
        </div>
    </div>

    <script>
        // Lista de perguntas (Você pode adicionar quantas quiser aqui)
        const quizData = [
            {
                category: "Metrologia",
                question: "Qual instrumento é indicado para medições diretas de precisão em milímetros e polegadas em oficinas mecânicas?",
                options: ["Trena métrica", "Paquímetro", "Esquadro de luz", "Goniômetro simples"],
                answer: 1 // Índice da resposta certa (0 = 1ª, 1 = 2ª, etc)
            },
            {
                category: "Desenho Técnico",
                question: "No Brasil, segundo a norma ABNT, em qual diedro é padronizada a representação de vistas ortogonais?",
                options: ["1º Diedro", "2º Diedro", "3º Diedro", "4º Diedro"],
                answer: 0
            },
            {
                category: "Segurança do Trabalho",
                question: "Qual das alternativas representa um Equipamento de Proteção Individual (EPI) indispensável na operação de tornos e fresadoras?",
                options: ["Luva de raspa grossa", "Óculos de proteção", "Corrente de identificação", "Relógio digital"],
                answer: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            const q = quizData[currentQuestion];
            
            document.getElementById("quiz-category").innerText = q.category;
            document.getElementById("quiz-question").innerText = q.question;
            document.getElementById("quiz-progress").innerText = `Pergunta ${currentQuestion + 1} de ${quizData.length}`;
            document.getElementById("next-btn").style.display = "none";

            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            q.options.forEach((optionText, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = optionText;
                btn.onclick = () => selectOption(btn, index);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(btn, selectedIndex) {
            if (answered) return;
            answered = true;

            const q = quizData[currentQuestion];
            const buttons = document.querySelectorAll(".option-btn");

            if (selectedIndex === q.answer) {
                btn.classList.add("correct");
                score++;
            } else {
                btn.classList.add("incorrect");
                buttons[q.answer].classList.add("correct");
            }

            document.getElementById("next-btn").style.display = "block";
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            const card = document.querySelector(".quiz-card");
            card.innerHTML = `
                <h2>Quiz Concluído!</h2>
                <p>Você acertou <strong>${score}</strong> de <strong>${quizData.length}</strong> perguntas.</p>
                <button class="next-btn" style="display:block; width:100%;" onclick="location.reload()">Refazer Quiz</button>
            `;
        }

        // Inicializa o quiz ao carregar a página
        loadQuestion();
    </script>
</body>
</html>
